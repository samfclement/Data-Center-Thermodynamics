<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thermal Energy Journey</title>
    <meta name="description" content="Interactive cutaway showing how thermal energy travels from data center servers through AHUs, glycol, refrigeration and a cooling tower into the atmosphere." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffb547' opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fffdf2'/%3E%3C/svg%3E" />
    <style>
/* ==========================================================================
   Thermal Energy Journey — interface styles
   UI colour tokens live in :root. Simulation colours (fluids, packet, metals)
   live in src/config/theme.js.
   ========================================================================== */

:root {
  --bg: #070d18;
  --bg-2: #0b1424;
  --panel: #0f1a2d;
  --panel-2: #14223a;
  --line: #1f2e4a;
  --line-2: #2b3e60;
  --text: #e7eef8;
  --muted: #92a4c0;
  --faint: #5f7395;
  --accent: #ffb547;
  --accent-2: #ffd27a;
  --cool: #5ec8f2;
  --hot: #ff8a5c;
  --radius: 14px;
  --gap: 12px;
  --dock-h: 78px;
  --top-h: 54px;
  --font: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 30% -10%, #12223f 0%, transparent 60%), var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

/* ---- App grid ------------------------------------------------------------ */
.app {
  height: 100vh;
  display: grid;
  grid-template-rows: var(--top-h) minmax(0, 1fr) var(--dock-h);
  gap: 0;
}

/* ---- Top bar ------------------------------------------------------------ */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 calc(var(--gap) + 4px);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, #fffdf2 0 28%, #ffb547 45%, rgba(255, 181, 71, 0) 72%);
  box-shadow: 0 0 18px rgba(255, 181, 71, 0.55);
}
.brand h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-controls { display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 13px;
}
.seg button[aria-checked='true'] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
.speed { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.speed select {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; color: var(--text);
}
.tb-toggle, .tb-icon {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel);
  border-radius: 999px; padding: 5px 12px; color: var(--muted); font-size: 13px; font-weight: 600;
}
.tb-icon { padding: 5px; }
.tb-toggle[aria-pressed='true'] { color: var(--text); border-color: var(--line-2); background: var(--panel-2); }
.icon { display: inline-flex; }

/* ---- Main area -------------------------------------------------------- */
.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(360px, 32vw, 580px);
  gap: var(--gap);
  padding: 0 var(--gap);
  min-height: 0;
}

/* ---- Overview --------------------------------------------------------- */
.overview {
  position: relative;
  min-height: 0;
  border-radius: var(--radius);
  overflow: hidden;
  background: #0b1527;
  border: 1px solid var(--line);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35) inset;
}
.ov-host { position: absolute; inset: 0; }
.ov { width: 100%; height: 100%; display: block; }

.ov-zone { font-size: 12px; font-weight: 800; letter-spacing: 0.22em; fill: #7f93b3; opacity: 0.85; }
.ov-label text {
  font-size: calc(17px * var(--lk, 1));
  font-weight: 650;
  fill: #e8eef8;
  paint-order: stroke;
  stroke: #08101e;
  stroke-width: calc(4.5px * var(--lk, 1));
  stroke-linejoin: round;
  transition: fill 0.4s;
}
.ov-label.is-active text { fill: var(--accent-2); }
.ov-label.is-hover text { fill: #bfe3ff; }
.ov-leader { stroke: #9fb0c8; stroke-width: 1.2; opacity: 0.7; }

.equip { transition: opacity 0.6s ease, filter 0.4s ease; }
.ov.has-focus .equip:not(.is-active) { opacity: 0.7; }
.ov .equip.is-active { filter: drop-shadow(0 0 5px rgba(255, 196, 110, 0.85)); }
.ov .equip.is-hover { filter: drop-shadow(0 0 5px rgba(150, 205, 255, 0.95)); opacity: 1; }
.ov .ov-env > .ov-building > .equip.is-active,
.ov .ov-env > .ov-building > .equip.is-hover { filter: none; }
.ov .ov-env > .ov-building > .equip.is-active > rect:first-child { fill: url(#g-hall-air); }
.flow { transition: opacity 0.6s ease; }
.ov.has-focus .flow:not(.is-active) { opacity: 0.4; }
.ov .flow.is-active.air path { stroke-width: 4.6; }
.hit { cursor: pointer; outline: none; }
.hit:focus-visible { stroke: var(--accent-2); stroke-width: 2.5; stroke-dasharray: 5 4; fill: rgba(255, 210, 122, 0.06); }
.packet { pointer-events: none; }

/* Caption (top-left of overview) */
.caption {
  position: absolute; top: 12px; left: 12px; right: 360px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  pointer-events: none;
}
.cap-num {
  font-weight: 800; font-size: 12px; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--sys, #ffb547) 22%, #0b1220); color: var(--sys, var(--accent-2));
  border: 1px solid color-mix(in srgb, var(--sys, #ffb547) 55%, transparent);
}
.is-inspecting .cap-num { --sys: #9fd8ff; }
.cap-title {
  font-size: 20px; font-weight: 750; letter-spacing: 0.005em;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 2px rgba(0, 0, 0, 0.9);
}
.cap-mech {
  font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  color: var(--c, #fff); border: 1px solid color-mix(in srgb, var(--c, #fff) 60%, transparent);
  background: rgba(8, 14, 26, 0.75);
}

/* Legend (top-right of overview, collapsible) */
.legend {
  position: absolute; right: 12px; top: 12px; z-index: 1;
  font-size: 11.5px; color: var(--muted);
  background: rgba(7, 12, 22, 0.8); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px;
  max-width: min(330px, 45%);
}
.legend summary { cursor: pointer; font-weight: 700; color: var(--text); font-size: 11.5px; letter-spacing: 0.04em; }
.legend[open] summary { margin-bottom: 4px; }
.lg-items { display: grid; grid-template-columns: repeat(2, max-content); gap: 3px 14px; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-sw { width: 22px; height: 8px; display: inline-block; }
.lg-dots { background: radial-gradient(circle, var(--c) 0 2.2px, transparent 2.6px) 0 50% / 7px 8px repeat-x; }
.lg-pipe { border-radius: 4px; background: var(--c); box-shadow: 0 0 0 2px #2a3242 inset, 0 0 0 1px #2a3242; }
.lg-bolt { background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 9px); height: 3px; }
.lg-packet { color: var(--accent-2); font-weight: 700; grid-column: 1 / -1; }
.lg-packet-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: radial-gradient(circle, #fffdf2 0 35%, #ffb547 55%, rgba(255, 181, 71, 0) 75%);
  box-shadow: 0 0 10px rgba(255, 181, 71, 0.8);
}
.overview::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 90px; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, rgba(6, 11, 21, 0.78), rgba(6, 11, 21, 0));
}
.caption { z-index: 2; }

/* Minimap (bottom-right of overview) */
.minimap {
  position: absolute; right: 12px; bottom: 12px; width: 180px; aspect-ratio: 1600 / 800; z-index: 1;
  border-radius: 10px; overflow: hidden; border: 1px solid var(--line-2);
  opacity: 0; transform: translateY(6px); transition: opacity 0.4s, transform 0.4s; pointer-events: none;
}
.minimap.is-visible { opacity: 0.95; transform: none; }
.minimap svg { width: 100%; height: 100%; display: block; }

/* First-run hint */
.hint {
  position: absolute; bottom: 12px; left: 12px; max-width: 360px; z-index: 2;
  display: flex; gap: 10px; align-items: flex-start;
  background: rgba(10, 18, 34, 0.92); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 10px 10px 12px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); font-size: 12.5px; color: var(--muted);
  transition: opacity 0.5s, transform 0.5s;
}
.hint p { margin: 0; }
.hint strong { color: var(--text); }
.hint.is-hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }
.hint-dot {
  width: 14px; height: 14px; margin-top: 2px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, #fffdf2 0 32%, #ffb547 52%, rgba(255, 181, 71, 0) 74%);
  box-shadow: 0 0 12px rgba(255, 181, 71, 0.9);
}
.hint-close { border: 0; background: transparent; color: var(--muted); padding: 0; }

/* ---- Side column ------------------------------------------------------- */
.side { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
.card { background: linear-gradient(180deg, var(--panel) 0%, #0d1729 100%); border: 1px solid var(--line); border-radius: var(--radius); }

.closeup { flex: none; padding: 10px 10px 8px; }
.cu-head { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: baseline; padding: 0 2px 6px; }
.cu-badge {
  font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-2);
  border: 1px solid rgba(255, 210, 122, 0.4); border-radius: 6px; padding: 1px 6px;
}
.cu-title { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cu-locator { grid-column: 1 / -1; margin: 2px 0 0; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cu-host {
  position: relative; width: 100%; aspect-ratio: 3 / 2; border-radius: 10px; overflow: hidden;
  background: #0b1424; border: 1px solid var(--line);
  max-height: 46vh;
}
.cu-caption { margin: 8px 2px 0; font-size: 12.5px; color: var(--muted); min-height: 2.9em; line-height: 1.4; }

.cu { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 0.45s ease, transform 0.45s ease; }
.cu.entering { opacity: 0; transform: scale(0.965); }
.cu.leaving { opacity: 0; transform: scale(1.02); }

.cu-label text { font-size: 16px; font-weight: 650; fill: #e1e9f4; paint-order: stroke; stroke: #08101e; stroke-width: 3.6px; stroke-linejoin: round; }
.cu-label.sm text { font-size: 14px; font-weight: 600; }
.cu-label.cool text { fill: #8fdcff; }
.cu-label.hot text { fill: #ffb08c; }
.cu-label.glycol text { fill: #8af2c6; }
.cu-label.refrig text { fill: #d9caff; }
.cu-label.water text { fill: #a8cdff; }
.cu-label.electric text { fill: #fde047; }
.cu-label.vapour text { fill: #eef2f7; }
.cu-leader { stroke: #a9b8cc; stroke-width: 1; opacity: 0.75; }
.cu-leader-dot { fill: #a9b8cc; }
.cu-chip-text { font-size: 12.5px; font-weight: 700; }
.cu-gauge-text { font-size: 12.5px; font-weight: 800; letter-spacing: 0.12em; paint-order: stroke; stroke: #08101e; stroke-width: 3px; }
.cu-inset-title { font-size: 12.5px; fill: #c3ccd8; font-weight: 600; }
.cu-mag rect { fill: none; stroke: var(--accent-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.cu-mag line { stroke: var(--accent-2); stroke-width: 1; opacity: 0.35; stroke-dasharray: 4 4; }

.part { transition: filter 0.45s ease, opacity 0.45s ease; }
.hl-source { filter: drop-shadow(0 0 5px rgba(255, 138, 80, 0.95)); }
.hl-target { filter: drop-shadow(0 0 7px rgba(255, 214, 122, 0.95)); }
.part.iface { opacity: 0; }
.part.iface.hl-iface { opacity: 1; }
.part.iface.hl-iface :is(line, circle, ellipse, path) { animation: march 1.1s linear infinite; }
.part:not(.iface).hl-iface { animation: iface-pulse 1.3s ease-in-out infinite; }
@keyframes march { to { stroke-dashoffset: -18; } }
@keyframes iface-pulse {
  0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 214, 122, 0.7)); }
  50% { filter: drop-shadow(0 0 10px rgba(255, 214, 122, 1)); }
}
[data-show] { opacity: 0; transition: opacity 0.45s ease; }
[data-show].is-shown { opacity: 1; }

/* ---- Info card ------------------------------------------------------- */
.info { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 12px 14px; scrollbar-width: thin; }
.info-body { animation: fade-in 0.35s ease; }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.info-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sys-tag { font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sys, var(--accent)); }
.step { font-size: 11.5px; color: var(--faint); font-weight: 600; }
.info-title { margin: 4px 0 8px; font-size: 18px; line-height: 1.25; }
.media-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
.medium {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 10px 3px 6px;
}
.swatch { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.arrow { color: var(--accent-2); font-weight: 800; }
.arrow.carried { font-size: 11.5px; color: var(--muted); font-weight: 600; font-style: italic; }
.fields { margin: 0; display: grid; grid-template-columns: 1fr; }
.fields dt { font-size: 10.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); margin-top: 8px; }
.fields dd { margin: 2px 0 0; font-size: 13.2px; color: #d7e1ef; }
.kind { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; padding: 1px 7px; border-radius: 6px; margin-left: 2px; vertical-align: 1px; }
.kind-transfer { color: #ffd27a; background: rgba(255, 210, 122, 0.12); border: 1px solid rgba(255, 210, 122, 0.4); }
.kind-transport { color: #9cc6ff; background: rgba(120, 170, 255, 0.12); border: 1px solid rgba(120, 170, 255, 0.4); }
.kind-energy { color: #fde047; background: rgba(250, 204, 21, 0.1); border: 1px solid rgba(250, 204, 21, 0.4); }
.mech-def { margin: 12px 0 0; padding-top: 10px; border-top: 1px dashed var(--line-2); font-size: 12px; color: var(--muted); }
.mech-def b { color: var(--text); }

.inspecting h3 { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 12px 0 4px; }
.eq-summary { margin: 0; font-size: 13.2px; color: #d7e1ef; }
.eq-features { margin: 0; padding-left: 18px; font-size: 12.8px; color: #c9d5e6; }
.eq-features li { margin: 2px 0; }
.eq-role { margin: 10px 0 0; font-size: 12.8px; color: var(--muted); }
.eq-role b { color: var(--text); }
.back-btn {
  display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line-2); background: var(--panel-2);
  border-radius: 999px; padding: 2px 10px 2px 4px; font-size: 12px; font-weight: 700; color: var(--text);
}
.rel-stages { display: flex; flex-wrap: wrap; gap: 6px; }
.rel-stage {
  border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 8px; padding: 3px 8px; font-size: 12px; color: #d7e1ef;
}
.rel-stage:hover { border-color: var(--accent-2); }

/* ---- Dock ------------------------------------------------------------ */
.dock {
  display: flex; align-items: center; gap: 18px;
  padding: 8px calc(var(--gap) + 4px) 10px;
  min-width: 0;
}
.transport { display: flex; align-items: center; gap: 6px; flex: none; }
.tr-btn {
  width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center;
  border: 1px solid var(--line-2); background: var(--panel); color: var(--text);
  transition: background 0.2s, transform 0.1s, border-color 0.2s;
}
.tr-btn:hover { background: var(--panel-2); border-color: #3b5480; }
.tr-btn:active { transform: scale(0.95); }
.tr-btn:disabled { opacity: 0.35; cursor: default; }
.tr-play { width: 52px; height: 52px; background: linear-gradient(180deg, #ffc768, #f59e2b); color: #1b1203; border: 0; box-shadow: 0 4px 18px rgba(255, 170, 60, 0.35); }
.tr-play:hover { background: linear-gradient(180deg, #ffd28a, #ffad45); }

.strip { display: flex; gap: 14px; align-items: flex-end; overflow-x: auto; min-width: 0; padding: 2px 2px 4px; scrollbar-width: thin; flex: 1; }
.strip-group { display: flex; flex-direction: column; gap: 4px; flex: none; }
.strip-label { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sys); white-space: nowrap; }
.strip-row { display: flex; gap: 4px; padding-top: 4px; border-top: 2px solid color-mix(in srgb, var(--sys) 70%, transparent); }
.stage-btn {
  position: relative; width: 32px; height: 32px; border-radius: 9px; overflow: hidden;
  border: 1px solid var(--line-2); background: var(--panel); color: var(--muted); font-weight: 700; font-size: 12.5px;
  display: inline-grid; place-items: center;
}
.stage-btn:hover { color: var(--text); border-color: var(--sys); }
.stage-btn.is-done { background: color-mix(in srgb, var(--sys) 16%, var(--panel)); color: #c6d3e6; }
.stage-btn.is-active { border: 2px solid var(--sys); color: #fff; background: color-mix(in srgb, var(--sys) 22%, var(--panel)); box-shadow: 0 0 14px color-mix(in srgb, var(--sys) 45%, transparent); }
.stage-fill { position: absolute; left: 0; bottom: 0; width: 100%; height: calc(var(--p, 0) * 100%); background: color-mix(in srgb, var(--sys) 38%, transparent); display: none; }
.stage-btn.is-active .stage-fill { display: block; }
.stage-num { position: relative; }

/* ---- Help ------------------------------------------------------------- */
.help {
  position: fixed; top: calc(var(--top-h) + 6px); right: 16px; width: min(420px, calc(100vw - 32px));
  background: #0d1729; border: 1px solid var(--line-2); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6); z-index: 10; font-size: 13px; color: #cfd9e8;
}
.help[hidden] { display: none; }
.help-head { display: flex; justify-content: space-between; align-items: center; }
.help h2 { font-size: 16px; margin: 0; }
.help h3 { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 12px 0 6px; }
.help-close { border: 0; background: transparent; color: var(--muted); }
.help-list { padding-left: 18px; margin: 8px 0 0; }
.help-list li { margin: 4px 0; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.keys dd { margin: 0; color: var(--muted); }
kbd { font-family: inherit; font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; }

/* ---- Responsive --------------------------------------------------------- */
@media (max-width: 1180px) {
  .brand p { display: none; }
  .main { grid-template-columns: minmax(0, 1fr) clamp(300px, 34vw, 420px); }
  .cap-title { font-size: 17px; }
  .legend { font-size: 10.5px; gap: 4px 10px; }
}
@media (max-height: 820px) {
  :root { --dock-h: 70px; --top-h: 48px; }
  .cu-host { max-height: 38vh; }
  .fields dd { font-size: 12.5px; }
  .cu-caption { min-height: 0; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-rows: auto auto auto; }
  .topbar { flex-wrap: wrap; padding: 8px 12px; }
  .main { grid-template-columns: 1fr; }
  .overview { aspect-ratio: 1600 / 900; }
  .dock { flex-wrap: wrap; }
}

/* ---- Reduced motion ------------------------------------------------------ */
@media (prefers-reduced-motion: reduce) {
  .part.iface.hl-iface :is(line, circle, ellipse, path), .part:not(.iface).hl-iface { animation: none; }
  .cu, .hint, .minimap, .info-body { transition: none; animation: none; }
}

</style>
